# ---------------------------------------------------------------------------
# flx-mcp-codigo: acceso compartido de los agentes de Flexxus al codigo (servidor MCP)
#
# Codigo e imagen: bitbucket.org/flexxus_id/flx-mcp-codigo
# Este repo es solo el stack: lo que Portainer despliega.
#
# API y App: clones de Bitbucket. ERP Corralon: git por SSH (192.168.121.240).
# ERP Enterprise: ramas Bazaar en \\192.168.121.14\_bzr\ERP (la misma carpeta que publica el FTP), montadas por SMB
# de solo lectura con FTP_USER / FTP_PASS. Desde 0.3.6 se exporta siempre la punta de la rama: el working tree de
# la rama central (lo que se ve por FTP) nunca se actualiza y tiene fuente viejo.
#
# Sin puerto publicado ni token: lo usan los stacks de la red "flx-agentes" con
# http://flx-mcp-codigo_mcp:8102/mcp. Estado: Asistente /api/agentes/salud?probar=1.
#
# Variables del stack: SERVICE_NAME, NODE, LOKI_URL y los secretos BITBUCKET_TOKEN,
# BITBUCKET_GIT_USER, ERP_CORRALON_PASS, FTP_USER, FTP_PASS.
# ---------------------------------------------------------------------------
version: '3.6'

services:
  mcp:
    image: fabreguesm/flx-mcp-codigo:0.4.3
    hostname: flx-mcp-codigo
    networks:
      - agentes
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - BITBUCKET_TOKEN=${BITBUCKET_TOKEN}
      - BITBUCKET_GIT_USER=${BITBUCKET_GIT_USER}
      - ERP_CORRALON_PASS=${ERP_CORRALON_PASS}
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      # Evidencia de cada caso (cotizacion o brief) en flx-mcp-memoria; si no responde, en /data/evidencia.
      - MEMORIA_URL=http://flx-mcp-memoria_mcp:8100/mcp
      # investigar con ticket lee el Helpdesk por flx-mcp-helpdesk.
      - HELPDESK_MCP_URL=http://flx-mcp-helpdesk_mcp:8101/mcp
      # Ramas Bazaar del ERP Enterprise (\\192.168.121.14\_bzr\ERP), como mcp/bazaar de flxwebapi: se exporta la punta de la rama.
      - ERP_BZR_REPO=/erp/bazaar/ERP
    # /data: clones de la API y la App y cache del ERP (vive en el nodo de NODE).
    volumes:
      - datos:/data
      - erp_bzr:/erp/bazaar:ro
    deploy:
      placement:
        constraints: ["${NODE}"]
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

volumes:
  datos:
    name: "${SERVICE_NAME}_datos"
  # \\192.168.121.14\_bzr por SMB, solo lectura, con el usuario del FTP del ERP (FTP_USER / FTP_PASS). Sin "vers": la negocia el kernel.
  erp_bzr:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.121.14/_bzr"
      o: "addr=192.168.121.14,username=${FTP_USER},password=${FTP_PASS},ro,uid=1000,gid=1000"

networks:
  agentes:
    external: true
    name: flx-agentes
